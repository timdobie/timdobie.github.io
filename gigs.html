<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Flip Side — Gigs</title>

  <style>
    :root {
      --maxw: 1100px;
      --gap: 16px;
      --pad: 18px;
      --radius: 12px;
      --bg: #0b0b0c;
      --panel: #141416;
      --panel2: #101012;
      --text: #f2f2f2;
      --muted: #b9b9b9;
      --accent-purple: #b57bff;
      --link: #7cc0ff;

      /* Added to support song-page top menu styling only */
      --line: #2a2a38;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* === Top menu copied from songs.html (unchanged) === */
    header.site-header{
      position:sticky; top:0; z-index:5;
      background:rgba(12,12,16,0.9);
      border-bottom:1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .topbar{
      max-width:1200px; margin:0 auto; padding:14px 18px;
      display:flex; align-items:center; gap:14px;
    }
    .logo{
      font-weight:800; letter-spacing:0.5px; font-size:20px;
    }
    nav{
      margin-left:auto; display:flex; gap:10px; flex-wrap:wrap;
    }
    nav a{
      text-decoration:none; color:var(--text);
      padding:8px 12px; border-radius:999px; font-weight:600; font-size:14px;
      background:transparent; border:1px solid transparent;
    }
    nav a:hover{ border-color:var(--line); background:var(--panel); }
    /* ================================================ */

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: var(--gap);
      display: grid;
      gap: var(--gap);
    }

    /* Keeping original banner styling, but now it's title-only */
    header.banner {
      padding: 12px 0 6px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    header.banner h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: .5px;
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      padding: var(--pad);
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 1.2rem;
    }
    .muted { color: var(--muted); }

    /* Gigs list + cards */
    .gigs-list {
      display: grid;
      gap: 12px;
    }

    /* 3-column layout: info | map | poster */
    .gig-card {
      background: var(--panel2);
      border-radius: 10px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 220px 220px;  /* map & poster narrower */
      gap: 12px;
      align-items: start;
      min-width: 0;
    }

    /* Left info stack */
    .gig-info {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .gig-date {
      font-size: 1.35rem;  /* larger Day/Date */
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .3px;
      white-space: nowrap;
    }

    .gig-venue {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-purple);
      line-height: 1.3;
    }

    .gig-address {
      line-height: 1.4;
    }

    .gig-notes {
      color: var(--muted);
      line-height: 1.4;
    }

    .gig-time {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .btn {
      display: inline-block;
      background: #1a1a1d;
      border: 1px solid #2a2a2e;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align:center;
      width: fit-content;
    }
    .btn.purple {
      background: var(--accent-purple);
      color: #0b0b0c;
      border-color: transparent;
    }

    /* Map column (always visible) */
    .gig-map iframe {
      width: 100%;
      height: 180px;       /* smaller height */
      border: 0;
      border-radius: 8px;
      display:block;
    }

    /* Poster column (thumb always visible) */
    .poster-thumb-wrap {
      cursor: pointer;
    }
    .poster-thumb {
      width: 100%;
      height: 180px;        /* match map height */
      object-fit: contain;
      background: #0d0d0f;
      border-radius: 8px;
      border: 1px solid #222;
      display: block;
    }
    .poster-caption {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    /* Poster lightbox modal */
    .poster-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .poster-modal img {
      max-width: 92%;
      max-height: 92%;
      border-radius: 12px;
      display:block;
    }
    #poster-close {
      position: absolute;
      top: 16px;
      right: 22px;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      line-height:1;
      user-select:none;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .gig-card {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .gig-date { white-space: normal; }

      /* Put map + poster side-by-side under the info */
      .gig-media {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .gig-map iframe,
      .poster-thumb {
        height: 200px;
      }
    }

    @media (max-width: 520px) {
      .gig-media {
        grid-template-columns: 1fr;
      }
      .gig-map iframe,
      .poster-thumb {
        height: 220px;
      }
    }
  </style>
</head>

<body>

  <!-- Top menu EXACTLY like songs.html -->
  <header class="site-header">
    <div class="topbar">
      <div class="logo">THE FLIP SIDE</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="gigs.html" style="background:var(--panel2); border-color:var(--line);">Gigs</a>
        <a href="songs.html">Song List</a>
      </nav>
    </div>
  </header>

  <div class="wrap">

    <!-- Original title area kept, but without the back button -->
    <header class="banner">
      <h1>Gigs</h1>
    </header>

    <div class="panel">
      <h2>Want The Flipside at your venue or event? Hit us up via Contact/Bookings on the home page.</h2>

      <div id="gigs-list" class="gigs-list"></div>
    </div>

  </div>

  <!-- Poster Modal (lightbox) -->
  <div id="poster-modal" class="poster-modal">
    <span id="poster-close">&times;</span>
    <img id="poster-modal-img" alt="Gig Poster Full Size">
  </div>

  <script>
    // ✅ EDIT THIS LIST ONLY
    // posterThumb = smaller image, posterFull = full-size poster
    const gigs = [
      {
        dayDate: "Wed 7th Jan 2026",
        onStage: "9 pm",
        venueName: "Here & Now Lounge",
        address: "Upstairs, Above Kahn Curry Hut. Level 1, 97-99 Ryrie Street Street Geelong Vic",
        mapsQuery: "Here and Now Lounge Geelong VIC 3220",
        venueUrl: "https://hereandnowlounge.com.au/",
        notes: "Free entry / 2 sets",
        posterThumb: "images/HereAndNow07012026.png",
        posterFull: "images/HereAndNow07012026.png"
      }
    ];

    function mapsLink(q) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }
    function mapsEmbed(q) {
      return `https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed`;
    }

    const list = document.getElementById("gigs-list");

    gigs.forEach((g, i) => {
      const card = document.createElement("div");
      card.className = "gig-card";

      card.innerHTML = `
        <div class="gig-info">
          <div class="gig-date">${g.dayDate}</div>
          <div class="gig-venue">${g.venueName}</div>
          <div class="gig-address">${g.address}</div>
          ${g.notes ? `<div class="gig-notes">${g.notes}</div>` : ""}
          <div class="gig-time">On stage: ${g.onStage}</div>
          ${g.venueUrl ? `
            <a class="btn purple" target="_blank" rel="noopener"
               href="${g.venueUrl}">View Website</a>
          ` : ""}
        </div>

        <div class="gig-media gig-map">
          <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="${mapsEmbed(g.mapsQuery)}"></iframe>
        </div>

        <div class="gig-media poster-thumb-wrap" data-poster-thumb="${i}">
          ${g.posterThumb ? `
            <img src="${g.posterThumb}" class="poster-thumb" alt="Gig Poster Thumbnail">
            <div class="poster-caption">Tap/click to view full poster</div>
          ` : ""}
        </div>
      `;

      list.appendChild(card);
    });

    // Poster lightbox
    const posterModal = document.getElementById("poster-modal");
    const posterModalImg = document.getElementById("poster-modal-img");
    const posterClose = document.getElementById("poster-close");

    document.querySelectorAll("[data-poster-thumb]").forEach(el => {
      el.addEventListener("click", () => {
        const i = el.getAttribute("data-poster-thumb");
        posterModalImg.src = gigs[i].posterFull || gigs[i].posterThumb;
        posterModal.style.display = "flex";
      });
    });

    posterClose.addEventListener("click", () => {
      posterModal.style.display = "none";
    });

    posterModal.addEventListener("click", (e) => {
      if (e.target === posterModal) posterModal.style.display = "none";
    });
  </script>
</body>
</html>
