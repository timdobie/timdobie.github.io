<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Flip Side — Gigs</title>

  <style>
    :root {
      --maxw: 1100px;
      --gap: 16px;
      --pad: 18px;
      --radius: 12px;
      --bg: #0b0b0c;
      --panel: #141416;
      --panel2: #101012;
      --text: #f2f2f2;
      --muted: #b9b9b9;
      --accent-purple: #b57bff;
      --link: #7cc0ff;
      --line: #2a2a38;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* === Top menu copied from songs.html (unchanged) === */
    header.site-header{
      position:sticky; top:0; z-index:5;
      background:rgba(12,12,16,0.9);
      border-bottom:1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .topbar{
      max-width:1200px; margin:0 auto; padding:14px 18px;
      display:flex; align-items:center; gap:14px;
    }
    .logo{
      font-weight:800; letter-spacing:0.5px; font-size:20px;
    }
    nav{
      margin-left:auto; display:flex; gap:10px; flex-wrap:wrap;
    }
    nav a{
      text-decoration:none; color:var(--text);
      padding:8px 12px; border-radius:999px; font-weight:600; font-size:14px;
      background:transparent; border:1px solid transparent;
    }
    nav a:hover{ border-color:var(--line); background:var(--panel); }
    /* ================================================ */

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: var(--gap);
      display: grid;
      gap: var(--gap);
    }

    /* Keeping original banner styling, but now it's title-only */
    header.banner {
      padding: 12px 0 6px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    header.banner h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: .5px;
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      padding: var(--pad);
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 1.2rem;
    }
    .muted { color: var(--muted); }

    /* Gigs list + cards */
    .gigs-list {
      display: grid;
      gap: 12px;
    }

    /* 3-column layout: info | map | poster */
    .gig-card {
      background: var(--panel2);
      border-radius: 10px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 220px 220px;  /* map & poster narrower */
      gap: 12px;
      align-items: start;
      min-width: 0;
    }

    /* Past gigs keep layout but use a softer visual treatment */
    .gig-card.past-gig {
      background: #0d0d10;
      border: 1px solid #1e1e25;
    }
    .gig-card.past-gig .gig-date {
      color: #a4a4af;
    }
    .gig-card.past-gig .gig-venue {
      color: #8e77af;
    }
    .gig-card.past-gig .gig-address,
    .gig-card.past-gig .gig-notes,
    .gig-card.past-gig .gig-time {
      color: #9e9eaa;
    }
    .gig-card.past-gig .btn.purple {
      background: #6b5a86;
      color: #ece9f2;
    }
    .gig-card.past-gig .btn.photos {
      background: #141419;
      border-color: #23232b;
      color: #c8c8d2;
    }
    .gig-card.past-gig .poster-thumb,
    .gig-card.past-gig .gig-map iframe {
      filter: saturate(0.5) brightness(0.72) contrast(0.9);
    }

    /* Left info stack */
    .gig-info {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .gig-date {
      font-size: 1.35rem;  /* larger Day/Date */
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .3px;
      white-space: nowrap;
    }

    .gig-venue {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-purple);
      line-height: 1.3;
    }

    .gig-address {
      line-height: 1.4;
    }

    .gig-notes {
      color: var(--muted);
      line-height: 1.4;
    }

    .gig-time {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .btn {
      display: inline-block;
      background: #1a1a1d;
      border: 1px solid #2a2a2e;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align:center;
      width: fit-content;
    }
    .btn.purple {
      background: var(--accent-purple);
      color: #0b0b0c;
      border-color: transparent;
    }

    /* Map column (always visible) */
    .gig-map iframe {
      width: 100%;
      height: 180px;       /* smaller height */
      border: 0;
      border-radius: 8px;
      display:block;
    }

    /* Poster column (thumb always visible) */
    .poster-thumb-wrap {
      cursor: pointer;
    }
    .poster-thumb {
      width: 100%;
      height: 180px;        /* match map height */
      object-fit: contain;
      background: #0d0d0f;
      border-radius: 8px;
      border: 1px solid #222;
      display: block;
    }
    .poster-caption {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    /* Poster lightbox modal */
    .poster-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .poster-modal img {
      max-width: 92%;
      max-height: 92%;
      border-radius: 12px;
      display:block;
    }
    #poster-close {
      position: absolute;
      top: 16px;
      right: 22px;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      line-height:1;
      user-select:none;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .gig-card {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .gig-date { white-space: normal; }

      /* Put map + poster side-by-side under the info */
      .gig-media {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .gig-map iframe,
      .poster-thumb {
        height: 200px;
      }
    }

    @media (max-width: 520px) {
      .gig-media {
        grid-template-columns: 1fr;
      }
      .gig-map iframe,
      .poster-thumb {
        height: 220px;
      }
    }
  
    .btn.photos{
      background: #1a1a1d;
      border: 1px solid #2a2a2e;
      color: var(--text);
    }
    .btn.photos:hover{
      background: #0d0d10;
      text-decoration: none;
    }

    /* Fullscreen gallery modal (same as index) */
    .gallery-modal{
      display:none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.92);
    }
    .gallery-modal.open{ display:block; }
    .gallery-shell{
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      padding: 16px;
    }
    .gallery-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .gallery-title{
      font-weight: 900;
      letter-spacing: .3px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gallery-close{
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      user-select:none;
      padding: 2px 10px;
      border-radius: 10px;
    }
    .gallery-close:hover{ background: rgba(255,255,255,0.08); }

    .gallery-main{
      display:grid;
      grid-template-columns: 52px 1fr 52px;
      align-items:center;
      gap: 10px;
      min-height: 0;
    }
    .gallery-nav{
      height: 52px;
      width: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(20,20,22,0.65);
      color: var(--text);
      cursor: pointer;
      font-size: 26px;
      font-weight: 900;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }
    .gallery-nav:hover{ background: rgba(255,255,255,0.10); }
    .gallery-stage{
      height: 100%;
      min-height: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .gallery-img{
      max-width: 100%;
      max-height: calc(100vh - 220px);
      border-radius: 14px;
      background: #0b0b0c;
    }

    .gallery-strip{
      display:flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 2px 2px;
    }
    .gallery-thumb{
      height: 72px;
      width: auto;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      background: #0b0b0c;
      flex: 0 0 auto;
    }
    .gallery-thumb.active{
      border-color: var(--accent-purple);
    }

    @media (max-width: 700px){
      .gallery-main{ grid-template-columns: 44px 1fr 44px; }
      .gallery-nav{ height:44px; width:44px; font-size:22px; }
      .gallery-thumb{ height: 64px; }
      .gallery-img{ max-height: calc(100vh - 250px); }
    }

  </style>
</head>

<body>

  <!-- Top menu EXACTLY like songs.html -->
  <header class="site-header">
    <div class="topbar">
      <div class="logo">THE FLIP SIDE</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="gigs.html" style="background:var(--panel2); border-color:var(--line);">Gigs</a>
        <a href="songs.html">Song List</a>
      </nav>
    </div>
  </header>

  <div class="wrap">

    <!-- Original title area kept, but without the back button -->
    <header class="banner">
      <h1>Gigs</h1>
    </header>

    <div class="panel">
      <h2>Want The Flip Side at your venue or event? Hit us up via Contact/Bookings on the home page.</h2>

      <div id="gigs-list" class="gigs-list"></div>
    </div>

  </div>

  <!-- Poster Modal (lightbox) -->
  <div id="poster-modal" class="poster-modal">
    <span id="poster-close">&times;</span>
    <img id="poster-modal-img" alt="Gig Poster Full Size">
  </div>

  <script src="gig-data.js?v=20260417a"></script>
  <!-- Legacy inline gig list removed; shared data now comes only from gig-data.js -->
  <script>
    // ✅ EDIT THIS LIST ONLY
    // Edit gig-data.js instead.
    const gigs = [
      {
        date: "2026-03-21",
        dayDate: "Saturday 21st March 2026",
        onStage: "8 pm",
        venueName: "The Green Room Wine and Whiskey Bar",
        address: "94 Pakington St, Geelong West VIC 3218",
        mapsQuery: "The Green Room Wine and Whiskey Bar",
        venueUrl: "https://www.facebook.com/p/The-Green-Room-Wine-Whisky-and-Cocktail-Bar-100043234315014/",
        notes: "Free entry / 3 sets",
        posterThumb: "images/gigs/GreenRoom21032026sml.png",
        posterFull: "images/gigs/GreenRoom21032026sml.png"
      },
      {
        date: "2026-04-03",
        dayDate: "Friday 3rd April 2026",
        onStage: "8 pm",
        venueName: "Bancoora Life Saving Club",
        address: "101 Surf Club Ln, Breamlea VIC",
        mapsQuery: "Bancoora Surf Life Saving Club",
        venueUrl: "https://bancoora.asn.au/",
        notes: "Free entry / 3 sets",
        posterThumb: "images/gigs/Banny03042026.png",
        posterFull: "images/gigs/Banny03042026.png"
      },
      {
        date: "2026-01-07",
        dayDate: "Wed 7th Jan 2026",
        onStage: "9 pm",
        venueName: "Here & Now Lounge",
        address: "Upstairs, Above Kahn Curry Hut. Level 1, 97-99 Ryrie Street Street Geelong Vic",
        mapsQuery: "Here and Now Lounge Geelong VIC 3220",
        venueUrl: "https://hereandnowlounge.com.au/",
        notes: "Free entry / 2 sets",
        posterThumb: "images/gigs/HereAndNow07012026.png",
        posterFull: "images/gigs/HereAndNow07012026.png",
        photosFolder: "HereAndNowLounge07012026"
            }
    ];

    function mapsLink(q) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }
    function mapsEmbed(q) {
      return `https://www.google.com/maps?q=${encodeURIComponent(q)}&output=embed`;
    }

    const list = document.getElementById("gigs-list");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    gigs.forEach((g, i) => {
      const card = document.createElement("div");
      card.className = "gig-card";
      const gigDate = g.date ? new Date(`${g.date}T00:00:00`) : null;
      if (gigDate && gigDate < today) {
        card.classList.add("past-gig");
      }

      card.innerHTML = `
        <div class="gig-info">
          <div class="gig-date">${g.dayDate}</div>
          <div class="gig-venue">${g.venueName}</div>
          <div class="gig-address">${g.address}</div>
          ${g.notes ? `<div class="gig-notes">${g.notes}</div>` : ""}
          <div class="gig-time">On stage: ${g.onStage}</div>
          ${g.venueUrl ? `
            <a class="btn purple" target="_blank" rel="noopener"
               href="${g.venueUrl}">View Website</a>
          ` : ""}

          ${g.photosFolder ? `
            <a class="btn photos" href="#" data-photos-folder="${g.photosFolder}">Photos</a>
          ` : ""}
        </div>

        <div class="gig-media gig-map">
          <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="${mapsEmbed(g.mapsQuery)}"></iframe>
        </div>

        <div class="gig-media poster-thumb-wrap" data-poster-thumb="${i}">
          ${g.posterThumb ? `
            <img src="${g.posterThumb}" class="poster-thumb" alt="Gig Poster Thumbnail">
            <div class="poster-caption">Tap/click to view full poster</div>
          ` : ""}
        </div>
      `;

      list.appendChild(card);
    });

    // Poster lightbox
    const posterModal = document.getElementById("poster-modal");
    const posterModalImg = document.getElementById("poster-modal-img");
    const posterClose = document.getElementById("poster-close");

    document.querySelectorAll("[data-poster-thumb]").forEach(el => {
      el.addEventListener("click", () => {
        const i = el.getAttribute("data-poster-thumb");
        posterModalImg.src = gigs[i].posterFull || gigs[i].posterThumb;
        posterModal.style.display = "flex";
      });
    });

    posterClose.addEventListener("click", () => {
      posterModal.style.display = "none";
    });

    posterModal.addEventListener("click", (e) => {
      if (e.target === posterModal) posterModal.style.display = "none";
    });
  </script>

  <script>
    const renderedGigs = window.FlipSideGigs
      ? window.FlipSideGigs.renderGigsList("gigs-list")
      : [];
    const posterModalEl = document.getElementById("poster-modal");
    const posterModalImgEl = document.getElementById("poster-modal-img");

    document.querySelectorAll("[data-poster-index]").forEach((el) => {
      el.addEventListener("click", () => {
        const index = Number(el.getAttribute("data-poster-index"));
        const gig = renderedGigs[index];
        if (!gig) return;
        posterModalImgEl.src = gig.posterFull || gig.posterThumb;
        posterModalEl.style.display = "flex";
      });
    });
  </script>

  <!-- ===== Photos Gallery Modal ===== -->
  <div id="gallery-modal" class="gallery-modal" aria-hidden="true">
    <div class="gallery-shell">
      <div class="gallery-topbar">
        <div id="gallery-title" class="gallery-title">Photos</div>
        <div id="gallery-close" class="gallery-close" title="Close">&times;</div>
      </div>

      <div class="gallery-main">
        <button id="gallery-prev" class="gallery-nav" aria-label="Previous">&#x2039;</button>
        <div class="gallery-stage">
          <img id="gallery-img" class="gallery-img" alt="Gig photo">
        </div>
        <button id="gallery-next" class="gallery-nav" aria-label="Next">&#x203A;</button>
      </div>

      <div id="gallery-strip" class="gallery-strip" aria-label="Thumbnails"></div>
    </div>
  </div>
  <!-- =============================== -->


  <script src="photos-manifest.js"></script>
  <script src="photos-gallery.js"></script>
  <script>
    // Hook up Photos buttons on gig cards
    document.addEventListener("click", (e) => {
      const a = e.target.closest("[data-photos-folder]");
      if (!a) return;
      e.preventDefault();
      const folder = a.getAttribute("data-photos-folder");
      if (window.FlipSidePhotos && window.FlipSidePhotos.openGigGallery){
        window.FlipSidePhotos.openGigGallery(folder);
      }
    });
  </script>

</body>
</html>
