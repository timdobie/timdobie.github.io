<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>The Flip Side — Gigs</title>

  <style>
    :root {
      --maxw: 1100px;
      --gap: 16px;
      --pad: 18px;
      --radius: 12px;
      --bg: #0b0b0c;
      --panel: #141416;
      --panel2: #101012;
      --text: #f2f2f2;
      --muted: #b9b9b9;
      --accent-purple: #b57bff;
      --link: #7cc0ff;
      --line: #2a2a38;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* === Top menu copied from songs.html (unchanged) === */
    header.site-header{
      position:sticky; top:0; z-index:5;
      background:rgba(12,12,16,0.9);
      border-bottom:1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .topbar{
      max-width:1200px; margin:0 auto; padding:14px 18px;
      display:flex; align-items:center; gap:14px;
    }
    .logo{
      font-weight:800; letter-spacing:0.5px; font-size:20px;
    }
    nav{
      margin-left:auto; display:flex; gap:10px; flex-wrap:wrap;
    }
    nav a{
      text-decoration:none; color:var(--text);
      padding:8px 12px; border-radius:999px; font-weight:600; font-size:14px;
      background:transparent; border:1px solid transparent;
    }
    nav a:hover{ border-color:var(--line); background:var(--panel); }
    /* ================================================ */

    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: var(--gap);
      display: grid;
      gap: var(--gap);
    }

    /* Keeping original banner styling, but now it's title-only */
    header.banner {
      padding: 12px 0 6px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    header.banner h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: .5px;
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      padding: var(--pad);
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 1.2rem;
    }
    .booking-cta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .booking-cta h2 {
      margin: 0;
    }
    .muted { color: var(--muted); }

    /* Gigs list + cards */
    .gigs-list {
      display: grid;
      gap: 12px;
    }

    /* 3-column layout: info | map | poster */
    .gig-card {
      background: var(--panel2);
      border-radius: 10px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 220px 220px;  /* map & poster narrower */
      gap: 12px;
      align-items: start;
      min-width: 0;
    }

    /* Past gigs keep layout but use a softer visual treatment */
    .gig-card.past-gig {
      background: #0d0d10;
      border: 1px solid #1e1e25;
    }
    .gig-card.past-gig .gig-date {
      color: #a4a4af;
    }
    .gig-card.past-gig .gig-venue {
      color: #8e77af;
    }
    .gig-card.past-gig .gig-address,
    .gig-card.past-gig .gig-notes,
    .gig-card.past-gig .gig-time {
      color: #9e9eaa;
    }
    .gig-card.past-gig .btn.purple {
      background: #6b5a86;
      color: #ece9f2;
    }
    .gig-card.past-gig .btn.photos {
      background: #141419;
      border-color: #23232b;
      color: #c8c8d2;
    }
    .gig-card.past-gig .poster-thumb,
    .gig-card.past-gig .gig-map iframe {
      filter: saturate(0.5) brightness(0.72) contrast(0.9);
    }

    /* Left info stack */
    .gig-info {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .gig-date {
      font-size: 1.35rem;  /* larger Day/Date */
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .3px;
      white-space: nowrap;
    }

    .gig-venue {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-purple);
      line-height: 1.3;
    }

    .gig-address {
      line-height: 1.4;
    }

    .gig-notes {
      color: var(--muted);
      line-height: 1.4;
    }

    .gig-time {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .btn {
      display: inline-block;
      background: #1a1a1d;
      border: 1px solid #2a2a2e;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align:center;
      width: fit-content;
    }
    .btn.purple {
      background: var(--accent-purple);
      color: #0b0b0c;
      border-color: transparent;
    }

    /* Map column (always visible) */
    .gig-map iframe {
      width: 100%;
      height: 180px;       /* smaller height */
      border: 0;
      border-radius: 8px;
      display:block;
    }

    /* Poster column (thumb always visible) */
    .poster-thumb-wrap {
      cursor: pointer;
    }
    .poster-thumb {
      width: 100%;
      height: 180px;        /* match map height */
      object-fit: contain;
      background: #0d0d0f;
      border-radius: 8px;
      border: 1px solid #222;
      display: block;
    }
    .poster-caption {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    /* Poster lightbox modal */
    .poster-modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .poster-modal.open {
      display: flex;
    }
    .poster-modal img {
      max-width: 92%;
      max-height: 92%;
      border-radius: 12px;
      display:block;
      cursor: zoom-out;
    }
    #poster-close {
      position: absolute;
      top: 16px;
      right: 22px;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      line-height:1;
      user-select:none;
      z-index: 1;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.45);
    }

    /* Mobile */
    @media (max-width: 900px) {
      .gig-card {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .gig-date { white-space: normal; }

      /* Put map + poster side-by-side under the info */
      .gig-media {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .gig-map iframe,
      .poster-thumb {
        height: 200px;
      }
    }

    @media (max-width: 520px) {
      .gig-media {
        grid-template-columns: 1fr;
      }
      .gig-map iframe,
      .poster-thumb {
        height: 220px;
      }
    }
  
    .btn.photos{
      background: #1a1a1d;
      border: 1px solid #2a2a2e;
      color: var(--text);
    }
    .btn.photos:hover{
      background: #0d0d10;
      text-decoration: none;
    }

    /* Fullscreen gallery modal (same as index) */
    .gallery-modal{
      display:none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.92);
    }
    .gallery-modal.open{ display:block; }
    .gallery-shell{
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      padding: 16px;
    }
    .gallery-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .gallery-title{
      font-weight: 900;
      letter-spacing: .3px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gallery-close{
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      user-select:none;
      padding: 2px 10px;
      border-radius: 10px;
    }
    .gallery-close:hover{ background: rgba(255,255,255,0.08); }

    .gallery-main{
      display:grid;
      grid-template-columns: 52px 1fr 52px;
      align-items:center;
      gap: 10px;
      min-height: 0;
    }
    .gallery-nav{
      height: 52px;
      width: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(20,20,22,0.65);
      color: var(--text);
      cursor: pointer;
      font-size: 26px;
      font-weight: 900;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }
    .gallery-nav:hover{ background: rgba(255,255,255,0.10); }
    .gallery-stage{
      height: 100%;
      min-height: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .gallery-img{
      max-width: 100%;
      max-height: calc(100vh - 220px);
      border-radius: 14px;
      background: #0b0b0c;
    }

    .gallery-strip{
      display:flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 2px 2px;
    }
    .gallery-thumb{
      height: 72px;
      width: auto;
      border-radius: 10px;
      border: 2px solid transparent;
      cursor: pointer;
      background: #0b0b0c;
      flex: 0 0 auto;
    }
    .gallery-thumb.active{
      border-color: var(--accent-purple);
    }

    .calendar-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10001;
      background: rgba(0,0,0,0.88);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }
    .calendar-modal.open {
      display: flex;
    }
    .calendar-shell {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
    }
    .calendar-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--panel2);
      border-bottom: 1px solid var(--line);
    }
    .calendar-title {
      font-weight: 800;
      letter-spacing: .3px;
    }
    .calendar-close {
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      padding: 2px 10px;
      border-radius: 10px;
    }
    .calendar-close:hover {
      background: rgba(255,255,255,0.08);
    }
    .calendar-frame {
      width: 100%;
      height: min(70vh, 680px);
      border: 0;
      display: block;
      background: #fff;
    }

    @media (max-width: 700px){
      .gallery-main{ grid-template-columns: 44px 1fr 44px; }
      .gallery-nav{ height:44px; width:44px; font-size:22px; }
      .gallery-thumb{ height: 64px; }
      .gallery-img{ max-height: calc(100vh - 250px); }
      .calendar-frame { height: 72vh; }
    }

  </style>
</head>

<body>

  <!-- Top menu EXACTLY like songs.html -->
  <header class="site-header">
    <div class="topbar">
      <div class="logo">THE FLIP SIDE</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="gigs.html" style="background:var(--panel2); border-color:var(--line);">Gigs</a>
        <a href="songs.html">Song List</a>
      </nav>
    </div>
  </header>

  <div class="wrap">

    <!-- Original title area kept, but without the back button -->
    <header class="banner">
      <h1>Gigs</h1>
    </header>

    <div class="panel">
      <div class="booking-cta">
        <h2>Want The Flip Side at your venue or event? Hit us up via <a href="index.html">Contact/Bookings</a> on the home page.</h2>
        <button id="available-dates-btn" class="btn purple" type="button">Available Dates</button>
      </div>

      <div id="gigs-list" class="gigs-list"></div>
    </div>

  </div>

  <!-- Poster Modal (lightbox) -->
  <div id="poster-modal" class="poster-modal" aria-hidden="true">
    <span id="poster-close" role="button" aria-label="Close poster" tabindex="0">&times;</span>
    <img id="poster-modal-img" alt="Gig Poster Full Size">
  </div>

  <div id="calendar-modal" class="calendar-modal" aria-hidden="true">
    <div class="calendar-shell" role="dialog" aria-modal="true" aria-labelledby="calendar-title">
      <div class="calendar-topbar">
        <div id="calendar-title" class="calendar-title">Available Dates</div>
        <div id="calendar-close" class="calendar-close" role="button" aria-label="Close available dates" tabindex="0">&times;</div>
      </div>
      <iframe
        class="calendar-frame"
        src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Australia%2FMelbourne&showPrint=0&showCalendars=0&showTz=0&showTitle=0&mode=AGENDA&src=ZmQ5OGNkYjUzM2E3YTNkOGQ5ZDFkOThjMTk0NGY4ZjUxMmU3Njc4MzQxOTBiMTkwNjNjM2QzMjViOWI3MDRkZEBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23009688"
        title="The Flip Side available dates"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>

  <script>
    window.FLIPSIDE_ASSET_VERSION = `${Date.now()}`;

    function loadFreshScript(path) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const separator = path.includes("?") ? "&" : "?";
        script.src = `${path}${separator}v=${encodeURIComponent(window.FLIPSIDE_ASSET_VERSION)}`;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${path}`));
        document.body.appendChild(script);
      });
    }
  </script>

  <!-- ===== Photos Gallery Modal ===== -->
  <div id="gallery-modal" class="gallery-modal" aria-hidden="true">
    <div class="gallery-shell">
      <div class="gallery-topbar">
        <div id="gallery-title" class="gallery-title">Photos</div>
        <div id="gallery-close" class="gallery-close" title="Close">&times;</div>
      </div>

      <div class="gallery-main">
        <button id="gallery-prev" class="gallery-nav" aria-label="Previous">&#x2039;</button>
        <div class="gallery-stage">
          <img id="gallery-img" class="gallery-img" alt="Gig photo">
        </div>
        <button id="gallery-next" class="gallery-nav" aria-label="Next">&#x203A;</button>
      </div>

      <div id="gallery-strip" class="gallery-strip" aria-label="Thumbnails"></div>
    </div>
  </div>
  <!-- =============================== -->

  <script>
    (async () => {
      await loadFreshScript("gig-data.js");
      await loadFreshScript("photos-manifest.js");
      await loadFreshScript("photos-gallery.js");

      const renderedGigs = window.FlipSideGigs
        ? window.FlipSideGigs.renderGigsList("gigs-list")
        : [];
      const posterModalEl = document.getElementById("poster-modal");
      const posterModalImgEl = document.getElementById("poster-modal-img");
      const posterCloseEl = document.getElementById("poster-close");
      const availableDatesBtnEl = document.getElementById("available-dates-btn");
      const calendarModalEl = document.getElementById("calendar-modal");
      const calendarCloseEl = document.getElementById("calendar-close");

      function closePosterModal() {
        posterModalEl.classList.remove("open");
        posterModalEl.setAttribute("aria-hidden", "true");
        posterModalImgEl.removeAttribute("src");
      }

      function openPosterModal(src) {
        posterModalImgEl.src = src;
        posterModalEl.classList.add("open");
        posterModalEl.setAttribute("aria-hidden", "false");
        posterCloseEl.focus();
      }

      function closeCalendarModal() {
        calendarModalEl.classList.remove("open");
        calendarModalEl.setAttribute("aria-hidden", "true");
      }

      function openCalendarModal() {
        calendarModalEl.classList.add("open");
        calendarModalEl.setAttribute("aria-hidden", "false");
        calendarCloseEl.focus();
      }

      document.querySelectorAll("[data-poster-index]").forEach((el) => {
        el.addEventListener("click", () => {
          const index = Number(el.getAttribute("data-poster-index"));
          const gig = renderedGigs[index];
          if (!gig) return;
          openPosterModal(window.FlipSideGigs.assetUrl(gig.posterFull || gig.posterThumb));
        });
      });

      posterCloseEl.addEventListener("click", closePosterModal);
      posterCloseEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          closePosterModal();
        }
      });
      posterModalEl.addEventListener("click", (event) => {
        if (event.target === posterModalEl) {
          closePosterModal();
        }
      });
      availableDatesBtnEl.addEventListener("click", openCalendarModal);
      calendarCloseEl.addEventListener("click", closeCalendarModal);
      calendarCloseEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          closeCalendarModal();
        }
      });
      calendarModalEl.addEventListener("click", (event) => {
        if (event.target === calendarModalEl) {
          closeCalendarModal();
        }
      });
      posterModalImgEl.addEventListener("click", closePosterModal);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && posterModalEl.classList.contains("open")) {
          closePosterModal();
        }
        if (event.key === "Escape" && calendarModalEl.classList.contains("open")) {
          closeCalendarModal();
        }
      });

      // Hook up Photos buttons on gig cards
      document.addEventListener("click", (e) => {
        const a = e.target.closest("[data-photos-folder]");
        if (!a) return;
        e.preventDefault();
        const folder = a.getAttribute("data-photos-folder");
        if (window.FlipSidePhotos && window.FlipSidePhotos.openGigGallery){
          window.FlipSidePhotos.openGigGallery(folder);
        }
      });
    })().catch((error) => {
      console.error("Unable to load gigs assets.", error);
    });
  </script>

</body>
</html>
